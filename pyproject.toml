[project]
name = "fdic-ml-pipeline"
version = "0.1.0"
description = "Local-first FDIC ML pipeline for banking risk segmentation and analysis."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "seaborn>=0.13",
  "scikit-learn>=1.3,<1.10",
  "certifi>=2023.7",
]

[project.scripts]
fdic-ml = "fdic_ml_pipeline.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "backend/src"}

[tool.setuptools.packages.find]
where = ["backend/src"]
